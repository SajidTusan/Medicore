{% extends "base.html" %}

{% block content %}

<div class="page-container">

    <div class="page-header">
        <h1>Order Laboratory Test</h1>
        <p>Create a laboratory test order for this patient.</p>
    </div>

    <div class="card">

        <div class="card-body">

            <h2>Patient Information</h2>

            <p>
                <strong>Name:</strong>
                {{ consultation.patient.get_full_name }}
            </p>

            <p>
                <strong>Patient ID:</strong>
                {{ consultation.patient.public_id }}
            </p>

            <hr>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Lab Order
                </button>

                <a
                    href="{% url 'medical_records:consultation_detail' consultation.id %}"
                    class="btn btn-secondary"
                >
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
