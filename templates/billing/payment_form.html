{% extends "base.html" %}

{% block content %}

<h1>Record Payment</h1>

<p>
    <strong>Bill:</strong>
    {{ bill.bill_id }}
</p>

<p>
    <strong>Total:</strong>
    {{ bill.total_amount }}
</p>

<p>
    <strong>Already Paid:</strong>
    {{ bill.paid_amount }}
</p>

<p>
    <strong>Remaining:</strong>
    {{ remaining }}
</p>

<hr>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Record Payment
    </button>

</form>

{% endblock %}
