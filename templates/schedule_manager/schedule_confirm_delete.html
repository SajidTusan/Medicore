{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Delete Schedule</h1>

        <p class="text-muted">
            Confirm that you want to remove this schedule.
        </p>
    </div>

</div>


<div class="card">

    <h3>
        {{ schedule.date }}
    </h3>

    <p>
        {{ schedule.start_time }}
        -
        {{ schedule.end_time }}
    </p>

    <p>
        {{ schedule.get_schedule_type_display }}
    </p>


    <form method="post">

        {% csrf_token %}

        <a
            href="{% url 'schedule_manager:list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

        <button
            type="submit"
            class="btn btn-danger"
        >
            Confirm Delete
        </button>

    </form>

</div>

{% endblock %}
